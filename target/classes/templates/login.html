<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Admin Sign In</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-shell">
        <!-- left brand side -->
        <div class="brand-panel">
            <div class="logo">WIKI</div>
            <div class="tagline">
                Admin access portal.<br>
                Sign in to manage articles and comments.
            </div>
        </div>

        <!-- login form -->
        <div class="form-panel">
            <h1>Sign In</h1>
            <div class="subtitle">Enter your admin details</div>

            <form th:action="@{/login}" th:object="${loginRequest}" method="post">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}"
                       placeholder="Type your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="Type your password" required>

                <button type="submit" class="login-button">ACCESS PORTAL</button>
            </form>
        </div>
    </div>
</body>
</html>
